<!--
  Cuida Home Care — ícone do card "Contato Inicial" (FR11)
  Substitui o print da própria página usado hoje.

  Motivo: balão de conversa com coração = "escuta acolhedora antes de
  qualquer proposta", que é a promessa do primeiro contato na copy do site.
  Estilo: line art 2px, terminações arredondadas, igual aos ícones dos
  diferenciais. Usa currentColor, então herda --cor-roxo do contexto.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" role="img"
     aria-label="Contato inicial">
  <!-- Balão de conversa com rabicho inferior esquerdo -->
  <path d="M12 12h40a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H30l-10 8v-8h-8a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6z"/>
  <!-- Coração centrado no balão -->
  <path d="M32 35c-6.2-4.6-10.2-8.2-10.2-12.3a5.3 5.3 0 0 1 10.2-2.1 5.3 5.3 0 0 1 10.2 2.1c0 4.1-4 7.7-10.2 12.3z"/>
</svg>
